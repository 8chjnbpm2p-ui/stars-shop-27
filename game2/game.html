<script>
/* Keep menu navigation available even if the optional Three.js module fails to load. */
(()=>{
 const menu=document.getElementById('mainMenu');
 if(!menu)return;
 const panels=['settingsPanel','worldPanel','createPanel','pausePanel','achievementsPanel'].map(id=>document.getElementById(id));
 const status=document.getElementById('engineStatus');
 const showStatus=message=>{if(status)status.textContent=message};
 document.getElementById('blockWorldModule')?.addEventListener('error',()=>{
  showStatus('Браузер не смог запустить игровой модуль. Обнови страницу; если ошибка повторится, пришли скриншот.');
 });
 window.addEventListener('error',event=>{
  const detail=event?.message||'Неизвестная ошибка JavaScript';
  const where=event?.lineno?(' · строка '+event.lineno):'';
  showStatus('Ошибка игры: '+detail+where);
  console.error('Block World runtime error:',event?.error||event);
 });
 window.addEventListener('unhandledrejection',event=>{
  const reason=event?.reason;
  const detail=reason?.message||String(reason||'Неизвестная ошибка Promise');
  showStatus('Ошибка загрузки: '+detail);
  console.error('Block World unhandled rejection:',reason);
 });
 try{const meta=JSON.parse(localStorage.getItem('stars_blockworld_world_v1')||'null');const panel=document.getElementById('worldPanel');const create=document.getElementById('newWorld');if(create)create.textContent='＋ Создать новый мир';if(meta&&panel&&!document.getElementById('continueWorld')){const b=document.createElement('button');b.id='continueWorld';b.type='button';const name=String(meta.name||'Мой мир').slice(0,20);b.textContent='▶ Продолжить: '+name;panel.insertBefore(b,create||panel.children[1]||null)}}catch{}
 const hide=()=>panels.forEach(p=>p&&p.classList.remove('open'));
 const togglePause=()=>{const opened=!menu.classList.contains('hidden');if(opened){hide();menu.classList.add('hidden');menu.classList.remove('subpage','ingame');document.body.classList.remove('menu-open');document.getElementById('gameMenuBtn')?.setAttribute('aria-expanded','false');}else{hide();document.getElementById('pausePanel')?.classList.add('open');menu.classList.add('subpage','ingame');menu.classList.remove('hidden');document.body.classList.add('menu-open');document.getElementById('gameMenuBtn')?.setAttribute('aria-expanded','true');}};
 document.getElementById('gameMenuBtn')?.addEventListener('click',togglePause);
 const open=id=>{hide();menu.classList.add('subpage');document.getElementById(id)?.classList.add('open')};
 menu.addEventListener('click',e=>{
  const link=e.target.closest('a.menuNav');
  if(link&&menu.contains(link)){
   /* Let the browser follow the anchor as a fallback; JS also opens the panel. */
   switch(link.id){
    case 'createWorld':open('worldPanel');break;
    case 'newWorld':open('createPanel');break;
    case 'menuSettings':open('settingsPanel');break;
    case 'settingsDone':document.dispatchEvent(new Event('blockworld:settings'));hide();if(menu.classList.contains('ingame')){document.getElementById('pausePanel')?.classList.add('open');menu.classList.add('subpage')}else menu.classList.remove('subpage');break;
    case 'worldBack':hide();menu.classList.remove('subpage');break;
    case 'createBack':open('worldPanel');break;
    case 'menuBack':if(window.parent!==window&&window.parent.closeLibraryGame2)window.parent.closeLibraryGame2();else history.back();break;
   }
   return;
  }
  const button=e.target.closest('button');if(!button||!menu.contains(button))return;
  switch(button.id){
   case 'continueWorld':document.dispatchEvent(new Event('blockworld:continue'));break;
   case 'createWorld':open('worldPanel');break;
   case 'newWorld':open('createPanel');break;
   case 'joinWorld':{const t=document.getElementById('toast');if(t){t.textContent='Сетевая игра пока не подключена';t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1300)}break}
   case 'worldBack':hide();menu.classList.remove('subpage');break;
   case 'createBack':open('worldPanel');break;
   case 'menuSettings':open('settingsPanel');break;
   case 'gameMenuBtn':break;
   case 'resumeGame':hide();menu.classList.remove('subpage','ingame');menu.classList.add('hidden');document.body.classList.remove('menu-open');document.getElementById('gameMenuBtn')?.setAttribute('aria-expanded','false');break;
   case 'pauseSettings':open('settingsPanel');break;
   case 'openAchievements':open('achievementsPanel');break;
   case 'achievementsBack':open('pausePanel');break;
   case 'pauseExit':window.saveBlockWorldNow?.();hide();menu.classList.remove('ingame');menu.classList.remove('subpage');menu.classList.add('hidden');document.body.classList.remove('menu-open');document.getElementById('gameMenuBtn')?.setAttribute('aria-expanded','false');if(window.parent!==window&&window.parent.closeLibraryGame2)window.parent.closeLibraryGame2();else history.back();break;
   case 'settingsDone':document.dispatchEvent(new Event('blockworld:settings'));hide();if(menu.classList.contains('ingame')){document.getElementById('pausePanel')?.classList.add('open');menu.classList.add('subpage')}else menu.classList.remove('subpage');break;
   case 'startWorld':if(window.__blockWorldEngineReady){showStatus('');document.dispatchEvent(new Event('blockworld:start'))}else{window.__blockWorldPendingStart=true;showStatus('Подключаем игровой движок… Если это сообщение не исчезнет, игра не загрузилась.');}break;
   case 'menuBack':
    if(window.parent!==window&&window.parent.closeLibraryGame2)window.parent.closeLibraryGame2();else history.back();
    break;
  }
 });
})();
</script>
<script id="blockWorldModule">
(async()=>{
const engineStatus=document.querySelector('#engineStatus');
if(engineStatus)engineStatus.textContent='Запускаем игровой модуль…';
let MinecraftUtilities;
try{
 MinecraftUtilities=await import('./minecraft-utilities.js');
}catch(err){
 console.warn('Block World: вспомогательная библиотека недоступна, используем встроенную проверку столкновений.',err);
 MinecraftUtilities={AABBUtils:{intersects(a,b){
  const amin={x:a.center.x-a.extent.x,y:a.center.y-a.extent.y,z:a.center.z-a.extent.z};
  const amax={x:a.center.x+a.extent.x,y:a.center.y+a.extent.y,z:a.center.z+a.extent.z};
  const bmin={x:b.center.x-b.extent.x,y:b.center.y-b.extent.y,z:b.center.z-b.extent.z};
  const bmax={x:b.center.x+b.extent.x,y:b.center.y+b.extent.y,z:b.center.z+b.extent.z};
  return !(bmax.x<amin.x||bmin.x>amax.x||bmax.y<amin.y||bmin.y>amax.y||bmax.z<amin.z||bmin.z>amax.z);
 }}};
}
const {AABBUtils}=MinecraftUtilities;
window.BlockWorldUtilities=MinecraftUtilities;

let THREE,lastEngineError;
const engineSources=[
 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
 'https://unpkg.com/three@0.160.0/build/three.module.js',
 'https://esm.sh/three@0.160.0?bundle',
 'https://cdn.skypack.dev/three@0.160.0'
];
for(let attempt=0;attempt<engineSources.length;attempt++){
 const engineUrl=engineSources[attempt];
 if(engineStatus)engineStatus.textContent='Загружаем 3D-движок… Попытка '+(attempt+1)+' из '+engineSources.length;
 try{
  THREE=await Promise.race([
   import(engineUrl),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error('Превышено время ожидания')),15000))
  ]);
  if(THREE)break;
 }catch(err){lastEngineError=err;console.warn('Block World: не загрузился движок с',engineUrl,err)}
}
if(!THREE){
 const reason=lastEngineError?.message||'неизвестная ошибка';
 if(engineStatus)engineStatus.textContent='Не удалось загрузить игровой движок ('+reason+'). Проверь интернет и нажми «Создать» ещё раз.';
 throw lastEngineError||new Error('Three.js unavailable');
}
const root=document.querySelector('#game');const menu=document.querySelector('#mainMenu');document.body.classList.add('menu-open');
const settingsKey='stars_blockworld_settings_v1';
try{const saved=JSON.parse(localStorage.getItem(settingsKey)||'{}');if(saved.sensitivity)document.querySelector('#sensitivity').value=saved.sensitivity;if(saved.fov)document.querySelector('#fovSetting').value=saved.fov;if(saved.graphics)document.querySelector('#graphicsSetting').value=saved.graphics;if(saved.fps)document.querySelector('#fpsSetting').value=saved.fps}catch{}
function applyAndSaveSettings(){lookSensitivity=Number(document.querySelector('#sensitivity').value)/1000;camera.fov=Number(document.querySelector('#fovSetting').value);camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,Number(document.querySelector('#graphicsSetting').value),isMobileDevice?.72:1.15));desiredFPS=Math.max(30,Math.min(120,Number(document.querySelector('#fpsSetting').value)||60));try{localStorage.setItem(settingsKey,JSON.stringify({sensitivity:document.querySelector('#sensitivity').value,fov:document.querySelector('#fovSetting').value,graphics:document.querySelector('#graphicsSetting').value,fps:desiredFPS}))}catch{}}
document.addEventListener('blockworld:settings',applyAndSaveSettings);
['sensitivity','fovSetting','graphicsSetting','fpsSetting'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',applyAndSaveSettings);el.addEventListener('change',applyAndSaveSettings)});
document.querySelector('#hostWorld')?.addEventListener('click',()=>{pendingOnlineHost=true;document.querySelector('#newWorld')?.click()});document.querySelector('#joinWorld')?.addEventListener('click',joinOnlineRoom);document.querySelector('#pauseExit')?.addEventListener('click',stopOnline);
document.addEventListener('blockworld:start',()=>{
 try{
  gameMode=document.querySelector('#gameMode').value;document.body.classList.toggle('creative-mode',gameMode==='creative');if(!pendingOnlineHost)stopOnline();
  lookSensitivity=Number(document.querySelector('#sensitivity').value)/1000;
  const size=document.querySelector('#worldSize').value;
  worldRadius=size==='small'?8:size==='large'?32:16;
  const worldName=(document.querySelector('#worldName').value||'Мой мир').trim().slice(0,20)||'Мой мир';
  edits=[];
  localStorage.removeItem(editsKey);localStorage.removeItem(worldStateKey);
  for(const id of Object.keys(inventory))inventory[id]=0;
  if(gameMode==='creative')for(const id of ['grass','dirt','stone','wood','sand','leaves','planks','crafting_table','furnace','wool'])inventory[id]=64;
  Object.assign(itemDurability,maxDurability);
  saveInventory();
  renderInventory();
  savedWorldMeta={name:worldName,gameMode,worldRadius,createdAt:Date.now()};
  localStorage.setItem(worldMetaKey,JSON.stringify(savedWorldMeta));
  rebuildWorld();
  if(blocks.size<1000)throw new Error('Сгенерировано слишком мало блоков: '+blocks.size);
  menu.classList.remove('subpage');menu.classList.add('hidden');
  document.body.classList.remove('menu-open');
  const status=document.querySelector('#engineStatus');if(status)status.textContent='';
  toast('Мир «'+worldName+'» создан и сохранён');if(pendingOnlineHost){pendingOnlineHost=false;startOnlineHost()}
 }catch(err){console.error('Block World: world creation failed',err);const status=document.querySelector('#engineStatus');if(status)status.textContent='Ошибка создания мира: '+(err?.message||'неизвестная ошибка');toast('Не удалось создать мир.');}
});
document.addEventListener('blockworld:continue',()=>{
 try{
  if(savedWorldMeta){gameMode=savedWorldMeta.gameMode||'survival';document.body.classList.toggle('creative-mode',gameMode==='creative');worldRadius=savedWorldMeta.worldRadius||10}

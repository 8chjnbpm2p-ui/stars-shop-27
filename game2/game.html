<title>Block World — Stars Shop</title>
<style>
:root{color-scheme:dark;--panel:#101827dc;--line:#ffffff26}

#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}

#inventory.open{display:block}#inventoryHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#222;font-weight:900;text-shadow:1px 1px #fff}
#inventoryHead button{background:#777;color:#fff;border:2px solid;border-color:#aaa #333 #333 #aaa;border-radius:2px;padding:3px 10px}#achievementPanel{margin-top:12px;padding:9px;background:#aaa;border:2px solid;border-color:#777 #eee #eee #777;color:#222}#achievementTitle{font-weight:900;margin-bottom:7px}.achievement{display:flex;align-items:center;gap:9px;padding:6px;margin-top:4px;background:#c9c9c9;border:1px solid #888}.achievement>span{font-size:22px}.achievement div{display:grid;flex:1}.achievement small{font-size:11px;color:#555}.achievement strong{font-size:16px}.achievement.locked{opacity:.55}.achievement.earned{background:#d7edc5}

#playerPreview:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff4 1px,transparent 1px),linear-gradient(90deg,#fff4 1px,transparent 1px);background-size:16px 16px;opacity:.22}

.avatar-head{position:absolute;top:0;left:34px;width:36px;height:36px;background:linear-gradient(90deg,#bd805c 0 22%,#dca27a 22% 78%,#a96e50 78%);border:4px solid #70452f;box-shadow:inset 0 7px #60402e}
.avatar-head:after{content:"";position:absolute;left:5px;top:17px;width:5px;height:5px;background:#25364b;box-shadow:17px 0 #25364b,7px 10px #75412f}
.avatar-body{position:absolute;top:40px;left:27px;width:50px;height:66px;background:linear-gradient(90deg,#244b80 0 20%,#3976b8 20% 80%,#244b80 80%);border:3px solid #19385f}

.avatar-arm.left{left:5px}.avatar-arm.right{right:5px}
.avatar-leg{position:absolute;top:109px;width:23px;height:88px;background:linear-gradient(90deg,#283e68,#4569a0,#263c64);border:3px solid #1d2d4d}
.avatar-leg.left{left:28px}.avatar-leg.right{right:28px}
#inventoryMain{min-width:0}
#inventoryGrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}.item-icon{display:grid;place-items:center;width:100%;height:100%;font-size:clamp(17px,3vw,25px);line-height:1;filter:drop-shadow(1px 2px 1px #2228)}.slot .item-icon{font-size:22px}.craft-cell .item-icon,.craft-output .item-icon{font-size:24px}
.inventory-label{font-size:11px;color:#333;margin:8px 0 5px;font-weight:800}
.invslot{aspect-ratio:1;min-width:0;display:grid;place-items:center;gap:0;background:#777;border:2px solid;border-color:#aaa #333 #333 #aaa;border-radius:0;padding:2px;position:relative}
.invslot small{position:absolute;right:2px;bottom:0;font-size:10px;color:#fff;text-shadow:1px 1px #000;font-weight:900}
.invslot:disabled{opacity:.55}.invslot.selected{outline:2px solid #fff;outline-offset:-3px}
#inventoryHotbar{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
#craftArea{display:grid;grid-template-columns:auto 24px 48px;align-items:center;justify-content:center;gap:10px;margin:10px 0;padding:9px;background:#aaa;border:2px solid;border-color:#777 #fff #fff #777}#craftGrid{display:grid;grid-template-columns:repeat(2,42px);grid-template-rows:repeat(2,42px);gap:4px}.craft-cell,.craft-output{width:42px;height:42px;display:grid;place-items:center;background:#777;border:2px solid;border-color:#aaa #333 #333 #aaa;padding:2px;position:relative}.craft-output{width:48px;height:48px;background:#8a8a8a}.craft-cell small,.craft-output small{position:absolute;right:1px;bottom:0;font-size:9px;color:white;text-shadow:1px 1px #000}.craft-arrow{font-size:24px;color:#444;font-weight:900}@media(max-width:520px){#craftGrid{grid-template-columns:repeat(2,36px);grid-template-rows:repeat(2,36px)}.craft-cell{width:36px;height:36px}.craft-output{width:42px;height:42px}#craftArea{gap:6px;padding:6px}}#inventoryNote{display:none}#craftHint:empty{display:none}#recipeList{display:grid;grid-template-columns:1fr;gap:5px}#recipeList button{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px;background:#888;border:2px solid;border-color:#aaa #333 #333 #aaa;color:#fff;font-size:11px;text-align:left;border-radius:0}#recipeList button:disabled{opacity:.4}
.block-icon{position:relative;width:25px;height:25px;display:block;image-rendering:pixelated;filter:drop-shadow(1px 2px 0 #2228)}
.block-icon:before{content:"";position:absolute;left:2px;top:1px;width:20px;height:9px;transform:skewY(-25deg);background:var(--top);border:1px solid #2225}
.block-icon:after{content:"";position:absolute;left:2px;top:9px;width:20px;height:14px;background:var(--front);border:1px solid #2225;box-shadow:5px -2px 0 -1px var(--side)}
.block-icon.grass{--top:#72bd4b;--front:#805637;--side:#4b9138;background:linear-gradient(90deg,transparent 0 2px,#4b9138 2px 5px,transparent 5px)}
.block-icon.dirt{--top:#a8794c;--front:#805637;--side:#674329}
.block-icon.stone{--top:#b5bbc0;--front:#858d94;--side:#626a72}
.block-icon.wood{--top:#d3ad70;--front:#986438;--side:#704525}
.block-icon.sand{--top:#f0d994;--front:#d5bd79;--side:#b89c5d}
.block-icon.leaves{--top:#65a94d;--front:#34743d;--side:#285b32}
.block-icon.planks{--top:#d1a36c;--front:#a97845;--side:#80552f}
.block-icon.wool{--top:#f4f0e8;--front:#ddd8ce;--side:#bdb8af}.block-icon.knife:before{left:5px;top:3px;width:16px;height:5px;transform:rotate(-42deg);background:#dfe5e8;border:1px solid #555}.block-icon.knife:after{left:5px;top:14px;width:8px;height:5px;transform:rotate(-42deg);background:#805637;border:1px solid #49301e}
.block-icon.crafting_table{--top:#b88752;--front:#80512e;--side:#613b24}.block-icon.wooden_pickaxe:before{left:4px;top:4px;width:19px;height:5px;transform:rotate(-35deg);background:#c79a5b;border:1px solid #60411f}.block-icon.wooden_pickaxe:after{left:10px;top:9px;width:5px;height:16px;transform:rotate(-35deg);background:#956137;border:1px solid #60411f;box-shadow:none}.block-icon.planks{--top:#d1a36b;--front:#a87542;--side:#80552f}.block-icon.stick{--top:#c49a62;--front:#91633b;--side:#704b2d}.block-icon.wool{--top:#fff;--front:#d8d8d8;--side:#aaa}.block-icon.crafting_table{--top:#c69a60;--front:#79502e;--side:#51351f}
@media(max-width:520px){#inventoryLayout{grid-template-columns:112px minmax(0,1fr);gap:7px}#playerPreview{min-height:210px}#avatar{transform:scale(.82)}#equipment{grid-template-columns:repeat(2,34px)}.equip{width:34px;height:34px}#inventory{padding:8px}#inventoryGrid,#inventoryHotbar{gap:3px}}
@media(orientation:landscape) and (pointer:coarse){#inventoryBtn{left:auto;right:calc(50% - min(43vw, 220px) - 46px);bottom:calc(8px + env(safe-area-inset-bottom))}}
.action{width:62px;height:48px;padding:4px;font-size:11px;background:#101827d9;touch-action:none}

@media(pointer:coarse){#mobile,#actions{display:flex}#help{display:none}#hotbar{bottom:calc(8px + env(safe-area-inset-bottom))}.slot{width:clamp(30px,8.4vw,38px);height:40px}.slot .emoji{font-size:19px}#top{top:calc(8px + env(safe-area-inset-top))}}
@media(orientation:landscape) and (pointer:coarse){#mobile{bottom:calc(14px + env(safe-area-inset-bottom));left:14px}#actions{bottom:calc(14px + env(safe-area-inset-bottom));right:14px}#hotbar{bottom:calc(8px + env(safe-area-inset-bottom))}}@media(max-width:380px){.slot{width:clamp(29px,8vw,32px);height:37px}.slot .emoji{font-size:17px}#hotbar{gap:2px;padding:4px}}
#mainMenu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:8vw;padding:24px;background:linear-gradient(#17304bd9,#101827ed),radial-gradient(ellipse at center,#5d9bba,#152234);font-family:system-ui,sans-serif}#mainMenu.hidden{display:none}.menuBrand{width:min(440px,58vw);text-align:center}.menuTitle{font-size:clamp(34px,7vw,68px);font-weight:1000;letter-spacing:3px;color:#fff;text-shadow:4px 5px #344d28,-2px -2px #8acb55}.menuSubtitle{margin:5px 0 28px;color:#d4e6f4}.menuButtons{display:grid;gap:10px}.menuButtons button,#settingsPanel button{border:2px solid;border-color:#fff #343434 #343434 #fff;border-radius:2px;background:#777;padding:12px;font-size:17px;text-shadow:1px 2px #333;box-shadow:0 3px #222}.menuButtons button:first-child{background:#568d3f}.menuPlayer{width:180px;display:flex;flex-direction:column;align-items:center;gap:12px}.menuAvatar{position:relative;width:150px;height:280px;transform:scale(1.25);image-rendering:pixelated;filter:drop-shadow(8px 9px 0 #0005)}.menuAvatar .avatar-head{left:52px;width:48px;height:48px}.menuAvatar .avatar-body{top:52px;left:39px;width:72px;height:92px}.menuAvatar .avatar-arm{top:55px;width:26px;height:90px}.menuAvatar .avatar-arm.left{left:10px}.menuAvatar .avatar-arm.right{right:10px}.menuAvatar .avatar-leg{top:147px;width:33px;height:120px}.menuAvatar .avatar-leg.left{left:41px}.menuAvatar .avatar-leg.right{right:41px}.menuPlayerName{font-weight:900;font-size:18px;text-shadow:2px 2px #000}#settingsPanel,#worldPanel,#createPanel{display:none;text-align:left;background:#101d2bf2;padding:14px;margin-top:14px;border:1px solid #ffffff35;border-radius:12px;max-height:64vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin}#settingsPanel{min-height:0;max-height:64vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}#recipeList{display:grid;gap:5px}#recipeList button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;background:#777;border:2px solid;border-color:#aaa #333 #333 #aaa;color:#fff;font-size:11px;text-align:left}#recipeList button:disabled{opacity:.45}#settingsPanel.open,#worldPanel.open,#createPanel.open{display:grid;gap:12px}#worldPanel button,#createPanel button{width:100%}#createPanel input{min-width:0;width:100%;padding:9px;background:#333;color:#fff;border:1px solid #aaa;border-radius:7px}#mainMenu{overflow-y:auto;overscroll-behavior:contain;align-items:center}#mainMenu .menuBrand{max-height:94vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}#settingsPanel h3{margin:0}#settingsPanel label{display:grid;gap:5px;font-size:13px}#settingsPanel select{padding:8px;background:#333;color:#fff;border:1px solid #aaa}#settingsPanel input{width:100%}body.menu-open #top,body.menu-open #crosshair,body.menu-open #mineProgress,body.menu-open #help,body.menu-open #survivalHud,body.menu-open #hotbar,body.menu-open #mobile,body.menu-open #inventoryBtn,body.menu-open #inventory,body.menu-open #actions,body.menu-open #toast{display:none!important}@media(max-width:600px){#mainMenu{gap:3vw;padding:14px}.menuBrand{width:62vw}.menuPlayer{width:100px;transform:scale(.75);transform-origin:center}.menuTitle{letter-spacing:1px}.menuSubtitle{margin-bottom:15px}}
/* Compact menu and a polished 3D character preview */
#mainMenu{gap:clamp(18px,4vw,58px);padding:18px;background:radial-gradient(ellipse at 72% 48%,#477b83aa 0%,transparent 42%),linear-gradient(135deg,#101c2beF,#172b3bee 55%,#0c1727f5)}
.menuBrand{width:min(340px,48vw);padding:20px 22px;background:linear-gradient(145deg,#17283be8,#0c1728e8);border:1px solid #d8f1ff38;border-radius:20px;box-shadow:0 18px 55px #0007,inset 0 1px #ffffff22;backdrop-filter:blur(14px)}
.menuTitle{font-size:clamp(27px,4.5vw,44px);letter-spacing:1px;text-shadow:0 3px 0 #263f27,0 8px 22px #0009}
.menuSubtitle{margin:5px 0 17px;font-size:13px;color:#c8d9e9}
.menuButtons{gap:8px}
.menuButtons button,#settingsPanel button{border:1px solid #ffffff50;border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:0 3px 0 #0005;transition:transform .15s,filter .15s}
.menuButtons button:active,#settingsPanel button:active{transform:translateY(2px);filter:brightness(1.12)}

.menuButtons button:not(:first-child){background:linear-gradient(#65788c,#3c4b5e)}
.menuPlayer{width:min(250px,34vw);gap:3px}

.menuPlayerName{font-size:14px;letter-spacing:2px;color:#e6f4ff;text-shadow:0 2px 8px #000}

 #mainMenu{gap:4px;padding:10px}

<body>
<div id="game"></div><div id="mainMenu"><div class="menuBrand"><div class="menuTitle">BLOCK WORLD</div><div class="menuSubtitle">Твой мир начинается здесь</div><div class="menuButtons"><button id="createWorld">▶ Играть</button><button id="menuSettings">⚙ Настройки</button><button id="menuBack">← Назад</button></div><div id="settingsPanel"><h3>Настройки</h3><label>Чувствительность камеры <input id="sensitivity" type="range" min="2" max="12" value="5"></label><label>Поле зрения <input id="fovSetting" type="range" min="60" max="100" value="74"></label><label>Качество графики <select id="graphicsSetting"><option value="1.7">Высокое</option><option value="1.3">Среднее</option><option value="1">Низкое</option></select></label><button id="settingsDone">Готово</button></div><div id="worldPanel"><h3>Играть</h3><button id="newWorld">Создать мир</button><button id="joinWorld">Подключиться</button><button id="worldBack">Назад</button></div><div id="createPanel"><h3>Создать мир</h3><label>Название мира <input id="worldName" maxlength="20" value="Мой мир"></label><label>Режим <select id="gameMode"><option value="survival">Выживание</option><option value="creative">Творческий</option></select></label><label>Размер <select id="worldSize"><option value="small">Маленький</option><option value="normal" selected>Обычный — 49×49</option><option value="large">Большой — 65×65</option></select></label><button id="startWorld">Создать</button><button id="createBack">Назад</button></div></div><div class="menuPlayer"><div id="menu3d" aria-label="Трёхмерный персонаж"></div><div class="menuPlayerName">Игрок</div></div></div>
<div id="top"><button id="exit" type="button">← Игры</button></div>

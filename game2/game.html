document.querySelector('#placeBtn').addEventListener('click',e=>{e.preventDefault();placeBlock()});document.querySelector('#jumpBtn').onpointerdown=e=>{e.preventDefault();move.jump=true};document.querySelector('#jumpBtn').onpointerup=()=>move.jump=false;document.querySelector('#jumpBtn').onpointercancel=()=>move.jump=false;
let velocityY=0;const clock=new THREE.Clock();
const PLAYER_RADIUS=.28,PLAYER_HEIGHT=1.72,EYE_HEIGHT=1.65;
function collidesAt(x,feetY,z){const minX=x-PLAYER_RADIUS,maxX=x+PLAYER_RADIUS,minZ=z-PLAYER_RADIUS,maxZ=z+PLAYER_RADIUS;for(let bx=Math.floor(minX-.5);bx<=Math.ceil(maxX+.5);bx++)for(let by=Math.floor(feetY-.5);by<=Math.ceil(feetY+PLAYER_HEIGHT+.5);by++)for(let bz=Math.floor(minZ-.5);bz<=Math.ceil(maxZ+.5);bz++){const block=blocks.get(key(bx,by,bz));if(!block)continue;const overlapX=maxX>bx-.5&&minX<bx+.5,overlapZ=maxZ>bz-.5&&minZ<bz+.5,overlapY=feetY<by+.5&&feetY+PLAYER_HEIGHT>by-.5;if(overlapX&&overlapZ&&overlapY)return true}return false}
function floorAt(x,z){let top=0;const feetNow=camera.position.y-EYE_HEIGHT,minX=x-PLAYER_RADIUS,maxX=x+PLAYER_RADIUS,minZ=z-PLAYER_RADIUS,maxZ=z+PLAYER_RADIUS;for(let bx=Math.floor(minX-.5);bx<=Math.ceil(maxX+.5);bx++)for(let bz=Math.floor(minZ-.5);bz<=Math.ceil(maxZ+.5);bz++){if(maxX<=bx-.5||minX>=bx+.5||maxZ<=bz-.5||minZ>=bz+.5)continue;for(let by=0;by<=14;by++)if(by+.5<=feetNow+.08&&blocks.has(key(bx,by,bz)))top=Math.max(top,by+.5)}return top}
camera.position.y=heightAt(Math.round(camera.position.x),Math.round(camera.position.z))+2.15;
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);dayTime=(dayTime+dt/240)%1;const angle=dayTime*Math.PI*2+Math.PI/2;const sx=Math.cos(angle)*38,sy=Math.sin(angle)*30,sz=-18;sun.position.set(sx,sy,sz);moonLight.position.set(-sx,-sy,-sz);moonSprite.position.set(-sx,-sy,-sz);sunSprite.position.set(sx,sy,sz);const daylight=THREE.MathUtils.clamp((Math.sin(angle)+.12)/.35,0,1);sun.intensity=.12+2.15*daylight;moonLight.intensity=.08+.42*(1-daylight);hemi.intensity=.38+1.42*daylight;const skyDay=new THREE.Color(0x8cccf0),skyNight=new THREE.Color(0x071126);scene.background.copy(skyNight).lerp(skyDay,daylight);scene.fog.color.copy(scene.background);sunSprite.material.opacity=Math.max(.15,daylight);moonSprite.material.opacity=1-daylight;const f=Number(keys.KeyW||keys.ArrowUp||move.forward)-Number(keys.KeyS||keys.ArrowDown||move.back);const s=Number(keys.KeyD||keys.ArrowRight||move.right)-Number(keys.KeyA||keys.ArrowLeft||move.left);const dir=new THREE.Vector3(s,0,-f);if(dir.lengthSq()>0){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const speed=dt*((sprinting||keys.ShiftLeft||keys.ShiftRight)?5.612:4.317),nx=THREE.MathUtils.clamp(camera.position.x+dir.x*speed,-13,13),nz=THREE.MathUtils.clamp(camera.position.z+dir.z*speed,-13,13),feet=camera.position.y-EYE_HEIGHT;if(!collidesAt(nx,feet,camera.position.z))camera.position.x=nx;if(!collidesAt(camera.position.x,feet,nz))camera.position.z=nz}const ground=floorAt(camera.position.x,camera.position.z)+EYE_HEIGHT;if(move.jump&&camera.position.y<=ground+.06)velocityY=6.3;velocityY-=17*dt;let nextY=camera.position.y+velocityY*dt;if(velocityY<=0&&nextY<=ground){nextY=ground;velocityY=0}else if(velocityY>0&&collidesAt(camera.position.x,nextY-EYE_HEIGHT,camera.position.z)){velocityY=0;nextY=camera.position.y}camera.position.y=nextY;arm.rotation.z=-.18+Math.sin(performance.now()*.008)*(dir.lengthSq()>0?.045:.012);document.querySelector('#coords').textContent='XYZ: '+camera.position.x.toFixed(1)+' / '+(camera.position.y-EYE_HEIGHT).toFixed(1)+' / '+camera.position.z.toFixed(1);updateLook();renderer.render(scene,camera)}

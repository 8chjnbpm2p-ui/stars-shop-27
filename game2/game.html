camera.position.z+dir.z*speed,-worldRadius,worldRadius),feet=camera.position.y-EYE_HEIGHT;if(!collidesAt(nx,feet,camera.position.z)&&!mobs.some(m=>Math.hypot(m.g.position.x-nx,m.g.position.z-camera.position.z)<.62))camera.position.x=nx;if(!collidesAt(camera.position.x,feet,nz)&&!mobs.some(m=>Math.hypot(m.g.position.x-camera.position.x,m.g.position.z-nz)<.62))camera.position.z=nz}const ground=floorAt(camera.position.x,camera.position.z)+EYE_HEIGHT;if(move.jump&&camera.position.y<=ground+.06)velocityY=6.3;velocityY-=17*dt;let nextY=camera.position.y+velocityY*dt;if(velocityY<=0&&nextY<=ground){nextY=ground;velocityY=0}else if(velocityY>0&&collidesAt(camera.position.x,nextY-EYE_HEIGHT,camera.position.z)){velocityY=0;nextY=camera.position.y}camera.position.y=nextY;for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.userData.age+=dt;d.rotation.y+=dt*2;d.position.y=d.userData.baseY+Math.sin(d.userData.age*4)*.12;if(d.position.distanceTo(camera.position)<1.35){addItem(d.userData.type,1);scene.remove(d);drops.splice(i,1);toast('Предмет подобран')}}arm.rotation.z=-.18+Math.sin(performance.now()*.008)*(dir.lengthSq()>0?.045:.012);document.querySelector('#coords').textContent='XYZ: '+camera.position.x.toFixed(1)+' / '+(camera.position.y-EYE_HEIGHT).toFixed(1)+' / '+camera.position.z.toFixed(1);updateLook();renderer.render(scene,camera);hero.rotation.y=Math.sin(performance.now()*.00055)*.22;previewRenderer.render(previewScene,previewCamera)}

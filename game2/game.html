<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#87c9ed">
<title>Block World — Stars Shop</title>
<style>
:root{color-scheme:dark;--panel:#101827dc;--line:#ffffff26}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#87c9ed;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;backdrop-filter:blur(10px);box-shadow:0 8px 28px #07101e44}
#brand{font-weight:900;letter-spacing:.3px;font-size:14px}#hint{font-size:11px;color:#d2deef;margin-top:2px}
button{font:inherit;color:#fff;border:1px solid var(--line);background:#17243ddd;border-radius:12px;padding:9px 12px;font-weight:750}
#exit{pointer-events:auto}
#crosshair{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 1px 3px #000}
#crosshair:before{width:2px;height:18px;left:8px}#crosshair:after{height:2px;width:18px;top:8px}
#help{position:fixed;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-size:11px;color:#fff;text-shadow:0 2px 4px #000;white-space:nowrap;pointer-events:none}
#hotbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:#101827cf;border:1px solid var(--line);border-radius:15px;backdrop-filter:blur(10px)}
.slot{width:48px;height:48px;padding:3px;display:grid;place-items:center;gap:0;border:2px solid transparent;background:#27354dcc}
.slot.active{border-color:#fff;background:#425779}.slot .emoji{font-size:22px;line-height:24px}.slot small{font-size:9px;color:#d8e3f3}
#mobile{display:none;position:fixed;left:14px;bottom:calc(82px + env(safe-area-inset-bottom));width:136px;height:116px}
.move{position:absolute;width:42px;height:42px;padding:0;font-size:20px;background:#101827bb;touch-action:none}
#up{left:47px;top:0}#down{left:47px;bottom:0}#left{left:0;top:38px}#right{right:0;top:38px}
#actions{display:none;position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));gap:9px;flex-direction:column}
.action{width:62px;height:48px;padding:4px;font-size:11px;background:#101827d9;touch-action:none}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#101827df;padding:8px 13px;border-radius:12px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
@media(pointer:coarse){#mobile,#actions{display:flex}#help{display:none}#hotbar{bottom:calc(8px + env(safe-area-inset-bottom))}.slot{width:42px;height:44px}#top{top:calc(8px + env(safe-area-inset-top))}}
@media(max-width:380px){#brand{font-size:12px}#hint{font-size:10px}.slot{width:37px}.slot .emoji{font-size:19px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div class="panel"><div id="brand">🧱 BLOCK WORLD</div><div id="hint">Исследуй мир • строй • сохраняй</div></div><button id="exit" type="button">← Игры</button></div>
<div id="crosshair"></div><div id="help">WASD — движение · мышь — обзор · ЛКМ — сломать · ПКМ — поставить</div>
<div id="hotbar" aria-label="Панель блоков"></div>
<div id="mobile"><button class="move" id="up">▲</button><button class="move" id="down">▼</button><button class="move" id="left">◀</button><button class="move" id="right">▶</button></div>
<div id="actions"><button class="action" id="breakBtn">⛏ Сломать</button><button class="action" id="placeBtn">＋ Поставить</button><button class="action" id="jumpBtn">↑ Прыжок</button></div>
<div id="toast"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8cccf0);scene.fog=new THREE.Fog(0x8cccf0,22,58);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,100);camera.position.set(0,2.3,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf1ff,0x65744c,2));
const sun=new THREE.DirectionalLight(0xfff1d2,2.2);sun.position.set(-12,22,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x62ad48}),dirt:new THREE.MeshLambertMaterial({color:0x89603d}),stone:new THREE.MeshLambertMaterial({color:0x89929b}),wood:new THREE.MeshLambertMaterial({color:0x9a6738}),sand:new THREE.MeshLambertMaterial({color:0xd8c27b}),leaves:new THREE.MeshLambertMaterial({color:0x398348})};
const items=[['grass','🌿','Трава'],['dirt','🟫','Земля'],['stone','🪨','Камень'],['wood','🪵','Дерево'],['sand','🟨','Песок']];
let selected=0;
const hotbar=document.querySelector('#hotbar');
items.forEach((it,i)=>{const b=document.createElement('button');b.className='slot'+(i===0?' active':'');b.innerHTML='<span class="emoji">'+it[1]+'</span><small>'+(i+1)+'</small>';b.title=it[2];b.onclick=()=>select(i);hotbar.appendChild(b)});
function select(i){selected=(i+items.length)%items.length;[...hotbar.children].forEach((el,n)=>el.classList.toggle('active',n===selected))}
const geo=new THREE.BoxGeometry(1,1,1);const blocks=new Map();const key=(x,y,z)=>x+','+y+','+z;
function addBlock(x,y,z,type='grass',persist=false){const k=key(x,y,z);if(blocks.has(k))return;const mesh=new THREE.Mesh(geo,mats[type]||mats.grass);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData={x,y,z,type};scene.add(mesh);blocks.set(k,mesh);if(persist)saveEdits()}
function removeBlock(mesh){const {x,y,z}=mesh.userData;scene.remove(mesh);blocks.delete(key(x,y,z));saveEdits()}
function heightAt(x,z){return Math.max(0,Math.floor(1.1+Math.sin(x*.34)*.65+Math.cos(z*.28)*.55+Math.sin((x+z)*.19)*.4))}
for(let x=-13;x<=13;x++)for(let z=-13;z<=13;z++){const h=heightAt(x,z);for(let y=0;y<=h;y++)addBlock(x,y,z,y===h?'grass':y>h-3?'dirt':'stone');if(h>1&&((x*17+z*31)%37===0)){for(let y=h+1;y<h+4;y++)addBlock(x,y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<5)addBlock(x+dx,h+dy,z+dz,'leaves')}}
const editsKey='stars_blockworld_edits_v1';let edits=[];try{edits=JSON.parse(localStorage.getItem(editsKey)||'[]')}catch{};edits.forEach(e=>{if(e.op==='add')addBlock(e.x,e.y,e.z,e.type);else if(e.op==='del'){const m=blocks.get(key(e.x,e.y,e.z));if(m)removeBlockNoSave(m)}});
function removeBlockNoSave(m){scene.remove(m);const d=m.userData;blocks.delete(key(d.x,d.y,d.z))}
function saveEdits(){try{const base=[];for(const [k,m] of blocks){const {x,y,z,type}=m.userData;if(Math.abs(x)<=13&&Math.abs(z)<=13&&y<=8){const h=heightAt(x,z);const expected=y<=h?(y===h?'grass':y>h-3?'dirt':'stone'):null;if(expected!==type)base.push({op:'add',x,y,z,type})}}const original=[];for(let x=-13;x<=13;x++)for(let z=-13;z<=13;z++){const h=heightAt(x,z);for(let y=0;y<=h;y++)original.push(key(x,y,z))}const current=new Set([...blocks.keys()]);const removed=original.filter(k=>!current.has(k)).map(k=>{const [x,y,z]=k.split(',').map(Number);return{op:'del',x,y,z}});localStorage.setItem(editsKey,JSON.stringify([...base,...removed]))}catch{}}
const ray=new THREE.Raycaster();const center=new THREE.Vector2(0,0);
function target(){ray.setFromCamera(center,camera);const hits=ray.intersectObjects([...blocks.values()],false);return hits.find(h=>h.distance<6)||null}
function breakBlock(){const hit=target();if(!hit)return toast('Подойди ближе к блоку');const d=hit.object.userData;if(d.y===0)return toast('Нижний слой неразрушим');removeBlock(hit.object);toast('Блок сломан')}
function placeBlock(){const hit=target();if(!hit)return toast('Наведи прицел на блок');const n=hit.face.normal;const p=hit.object.position.clone().add(n);const x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);if(y<0||y>12)return;if(Math.hypot(x-camera.position.x,z-camera.position.z)<.9&&Math.abs(y-camera.position.y)<1.8)return toast('Здесь стоишь ты');const type=items[selected][0];if(blocks.has(key(x,y,z)))return;addBlock(x,y,z,type,true);toast('Блок поставлен')}
let toastTimer;function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity='0',1300)}
let yaw=0,pitch=0,locked=false;const keys={};const move={forward:false,back:false,left:false,right:false,jump:false};const isTouch=matchMedia('(pointer:coarse)').matches;
function updateLook(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}
renderer.domElement.addEventListener('click',()=>{if(!isTouch&&!locked)renderer.domElement.requestPointerLock?.()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;document.querySelector('#help').style.opacity=locked?'0':'1'});
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=THREE.MathUtils.clamp(pitch,-1.45,1.45);updateLook()});
let lookPointer=null,lastTouchX=0,lastTouchY=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(!isTouch)return;lookPointer=e.pointerId;lastTouchX=e.clientX;lastTouchY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!isTouch||lookPointer!==e.pointerId)return;const dx=e.clientX-lastTouchX,dy=e.clientY-lastTouchY;lastTouchX=e.clientX;lastTouchY=e.clientY;yaw-=dx*.005;pitch=THREE.MathUtils.clamp(pitch-dy*.005,-1.45,1.45);updateLook()});
const stopLook=e=>{if(lookPointer===e.pointerId)lookPointer=null};
renderer.domElement.addEventListener('pointerup',stopLook);renderer.domElement.addEventListener('pointercancel',stopLook);
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit'))select(Number(e.code.slice(5))-1);if(e.code==='Space')move.jump=true;if(e.code==='KeyE')placeBlock()});
document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')move.jump=false});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0&&locked)breakBlock();if(e.button===2&&locked)placeBlock()});
function bindMove(id,name){const el=document.getElementById(id);const on=e=>{e.preventDefault();move[name]=true;el.setPointerCapture?.(e.pointerId)};const off=e=>{e.preventDefault();move[name]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}
bindMove('up','forward');bindMove('down','back');bindMove('left','left');bindMove('right','right');
document.querySelector('#breakBtn').onclick=breakBlock;document.querySelector('#placeBtn').onclick=placeBlock;document.querySelector('#jumpBtn').onpointerdown=()=>move.jump=true;document.querySelector('#jumpBtn').onpointerup=()=>move.jump=false;
let velocityY=0;const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);const f=Number(keys.KeyW||keys.ArrowUp||move.forward)-Number(keys.KeyS||keys.ArrowDown||move.back);const s=Number(keys.KeyD||keys.ArrowRight||move.right)-Number(keys.KeyA||keys.ArrowLeft||move.left);const dir=new THREE.Vector3(s,0,-f);if(dir.lengthSq()>0){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(dir,dt*5)}const ground=heightAt(Math.round(camera.position.x),Math.round(camera.position.z))+1.65;if(move.jump&&camera.position.y<=ground+.06)velocityY=6.3;velocityY-=17*dt;camera.position.y+=velocityY*dt;if(camera.position.y<ground){camera.position.y=ground;velocityY=0}camera.position.x=THREE.MathUtils.clamp(camera.position.x,-13,13);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-13,13);updateLook();renderer.render(scene,camera)}
tick();
document.querySelector('#exit').onclick=()=>{if(window.parent!==window&&window.parent.closeLibraryGame2)window.parent.closeLibraryGame2();else history.back()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script>
</body></html>
